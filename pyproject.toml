[project]
name = "homework"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
    "pytest>=9.0.2",
    "ruff>=0.15.6",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[toll.ruff.lint]
# E, W — Flake8 (ошибки и предупреждения)
# F — Pyflakes
# I — Isort (сортировка импортов)
# B — Flake8-bugbear (поиск вероятных багов)
# C4 — Flake8-comprehensions
select = ["E", "W", "F", "I", "B", "C4"]
ignore = []

[toll.ruff.format]
quote-style = "double"
indent-style = "space"
